# CardboardOS GRUB Configuration

set timeout=5
set default=0

# Load modules
insmod multiboot
insmod elf
insmod gfxterm
insmod vbe
insmod font

# Set graphics mode
set gfxmode=1024x768x32,800x600x32,auto
set gfxpayload=keep

# Setup terminal
terminal_output gfxterm

# Background color
set color_normal=white/black
set color_highlight=yellow/blue

# Main menu
menuentry "CardboardOS" {
    multiboot /kernel/CardboardOS.elf
    boot
}

menuentry "CardboardOS - Verbose" {
    multiboot /kernel/CardboardOS.elf --verbose
    boot
}

menuentry "CardboardOS - Safe Mode" {
    multiboot /kernel/CardboardOS.elf --safe
    boot
}

menuentry "CardboardOS - Debug" {
    multiboot /kernel/CardboardOS.elf --debug
    boot
}

menuentry "System Info" {
    echo "CardboardOS v0.1.0"
    echo "Built: 2026-09-02"
    echo "Arch: x86_64"
    echo "Filesystem: exFAT"
    echo "Language: NotC"
    echo ""
    echo "Press any key to continue..."
    read
    boot
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}